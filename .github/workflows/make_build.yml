name: Build Linux and Windows

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            os: ubuntu-22.04

          - platform: windows
            arch: x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot C++
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          em-version: 3.1.62

      - name: Restore compilation cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.platform }}_${{ matrix.arch }}

      - name: Compile Debug
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=template_debug platform=${{ matrix.platform }} arch=${{ matrix.arch }} precision=single

      - name: Compile Release
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=template_release platform=${{ matrix.platform }} arch=${{ matrix.arch }} precision=single

      - name: Save compilation cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.platform }}_${{ matrix.arch }}

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error